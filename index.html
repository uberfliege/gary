<script>
let active = false;
const fl1=document.getElementById("fl1");
const flow=document.getElementById("flow1");
const fl2=document.getElementById("fl2");
const fl3=document.getElementById("fl3");
const flow2=document.getElementById("flow2");
const flow3=document.getElementById("flow3");
const menu=document.getElementById("menu");
const menu2=document.getElementById("menu2");
const audio=document.getElementById("ambient");
const menu3=document.getElementById("menu3");
const tv = document.getElementById("tv");
const musicToggle = document.getElementById("musicToggle");
let musicOn = false;
const bgVideo = document.getElementById("bgVideo");
const enterGate = document.getElementById("enterGate");
const enterButton = document.getElementById("enterButton");
enterButton.addEventListener("click", () => {

    /* start background video immediately */
    bgVideo.src = "assets/bg.mp4";
    bgVideo.play();

    /* opening TV video */
    tv.src = "assets/open_2_1.mp4";
    tv.muted = false;
    tv.style.display = "block";
    tv.play();

    /* start ambient music */
    audio.volume = 0.6;
    audio.play().catch(()=>{});
    musicToggle.classList.add("active");
    musicOn = true;

    /* remove enter overlay */
    enterGate.style.opacity = "0";

    setTimeout(()=>{
        enterGate.remove();
    },1000);

});

bgVideo.addEventListener("canplay", () => {
    bgVideo.classList.add("loaded");
});


function unloadTV() {
    if (!tv) return;
    tv.pause();              // stop playback
    tv.removeAttribute("src"); // remove source
    tv.load();               // force browser to unload it
    tv.style.display = "none"; // optional: hide it visually
}



/* ---------- AUDIO SAFE START ---------- */
document.body.addEventListener("pointerdown",()=>audio.volume=0,{once:true});

function unloadCarousel() {

    // Stop any playing video inside carousel
    const videos = carousel.querySelectorAll("video");
    videos.forEach(v => {
        v.pause();
        v.removeAttribute("src");
        v.load();
    });

    // Clear media
    const mediaLayer = document.getElementById("mediaLayer");
    mediaLayer.innerHTML = "";

    // Hide overlays
    document.querySelectorAll(".overlay").forEach(o => {
        o.style.display = "none";
    });

    // Hide carousel
    carousel.classList.remove("active");

    // Reset set
    currentSet = [];
    index = 0;

let currentSet = [];
let index = 0;
const carousel = document.getElementById("carousel");

function hideOverlays(){
  document.querySelectorAll(".overlay").forEach(o=>{
    o.style.display = "none";
  });
}




document.querySelectorAll(".menu-btn").forEach(btn => {
  btn.onclick = () => {
    const key = btn.dataset.set;
    if (!sets[key]) return;

    history.replaceState(null, "", "#" + key);
    currentSet = sets[key];
    index = 0;
    show();
    carousel.classList.add("active");
  };
});
prev.onclick = () => {
  if (!currentSet.length) return;
  index = (index - 1 + currentSet.length) % currentSet.length;
  show();
};

next.onclick = () => {
  if (!currentSet.length) return;
  index = (index + 1) % currentSet.length;
  show();
};


function show() {
  const mediaLayer = document.getElementById("mediaLayer");
    mediaLayer.innerHTML = "";

  hideOverlays();

  const item = currentSet[index];
  let el;

  if (item.type === "scene") {
    // media
    if (item.media.endsWith(".mp4")) {
      el = document.createElement("video");
      el.src = item.media;
      el.autoplay = el.loop = el.muted = true;
    } else {
      el = document.createElement("img");
      el.src = item.media;
    }

    mediaLayer.appendChild(el);


    // overlay
    if (item.overlay) {
      const overlay = document.getElementById(item.overlay);
      overlay.style.display = "flex";
    }

  } else {
    el = document.createElement("img");
    el.src = item.media;
    mediaLayer.appendChild(el);

  }
}
