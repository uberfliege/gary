    .title{
      color:#e6f7f6;
      font-size:18px;
      letter-spacing:0.6px;
    }
    .subtitle{
      color:var(--muted);
      font-size:13px;
    }

    /* Mail icon button */
    .mail-btn{
      position:absolute;
      top:18px;
      right:18px;
      background:transparent;
      border:1px solid rgba(255,255,255,0.06);
      color:var(--accent);
      width:44px;height:44px;
      border-radius:10px;
      display:inline-grid;
      place-items:center;
      cursor:pointer;
      transition:transform .14s ease, box-shadow .14s ease, background .12s ease;
      backdrop-filter: blur(6px);
      box-shadow:0 6px 18px rgba(2,6,23,0.5);
    }
    .mail-btn:hover{ transform:translateY(-4px) scale(1.02); background:rgba(79,209,197,0.03); }
    .mail-btn:active{ transform:translateY(-1px) scale(.99); }

    /* Small responsive tweaks */
    @media (max-width:480px){
      .logo{width:120px;height:120px;border-radius:20px;}
      .emblem{width:72px;height:72px;border-radius:14px;font-size:26px;}
    }
  </style>
</head>
<body>
  <div class="card" role="main" aria-label="Animated logo with mail button">
    <button class="mail-btn" title="Open mail" id="mailOpen" aria-label="Open mail client">
      <!-- simple mail SVG icon -->
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M3 7.5v9A2.5 2.5 0 0 0 5.5 19h13A2.5 2.5 0 0 0 21 16.5v-9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M21 7.5L12 13 3 7.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <div class="center">
      <div class="logo" aria-hidden="true">
        <div class="emblem" id="glogo">
            <img src="assets/garyenterlogo.png">
            <img id="soon" src="assets/soon.gif">
        </div>
      </div>
      <div>
        <div class="title"></div>
        <div class="subtitle"></div>
      </div>
    </div>
  </div>

  <script>
    // Configure recipient/subject/body as desired
    const mailBtn = document.getElementById('mailOpen');
    mailBtn.addEventListener('click', () => {
      const to = 'garyalongoria@pm.me';
      const subject = encodeURIComponent('Hello from website');
      const body = encodeURIComponent('Hi there'); // newline encoded
      // Use location.href to trigger default mail client
      window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    });
  </script>
</body>
